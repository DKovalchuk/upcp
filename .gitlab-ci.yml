# ══════════════════════════════════════════════════════════════
# UPCP CI/CD Pipeline
# ══════════════════════════════════════════════════════════════
#
# CI (continuous integration):
#   feature/* → MR → develop   (lint → test)
#   develop   → MR → main      (lint → test)
#
# CD (continuous delivery):
#   develop   → build → deploy:dev    (automatic)
#   main      → build → deploy:stage  (manual)
#   (manual)  maintenance:cleanup     → retention sweep on runner host
#
# Stage ordering: lint → test → build → deploy
# Pipeline stops at first failed stage.

stages:
  - lint
  - test
  - build
  - deploy

# ── Workflow rules ────────────────────────────────────────────
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  tags:
    - laptop
  interruptible: true
  timeout: 30 minutes

# ── Global variables ──────────────────────────────────────────
variables:
  GIT_DEPTH: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  DOCKER_BUILDKIT: "1"

# ── Retry policy ──────────────────────────────────────────────
.retry-on-system-failure:
  retry:
    max: 1
    when:
      - runner_system_failure

# ══════════════════════════════════════════════════════════════
# TEMPLATES
# ══════════════════════════════════════════════════════════════

.python-base:
  image: python:3.12-slim
  cache:
    key:
      files:
        - backend/requirements.txt
      prefix: backend-pip
    paths:
      - .cache/pip
    fallback_keys:
      - backend-pip
  before_script:
    - pip install --quiet -r backend/requirements.txt

.frontend-base:
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - .cache/npm
    fallback_keys:
      - frontend-npm
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund

.docker-build-base:
  stage: build
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY

# ══════════════════════════════════════════════════════════════
# CI: LINT — stage 1
# ══════════════════════════════════════════════════════════════

backend:lint:
  stage: lint
  extends:
    - .python-base
    - .retry-on-system-failure
  script:
    - ruff check backend
    - ruff format --check backend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

backend:typecheck:
  stage: lint
  extends:
    - .python-base
    - .retry-on-system-failure
  script:
    - mypy backend/app
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:lint:
  stage: lint
  extends:
    - .frontend-base
    - .retry-on-system-failure
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# CI: TEST — stage 2
# ══════════════════════════════════════════════════════════════

backend:test:
  stage: test
  extends:
    - .python-base
    - .retry-on-system-failure
  needs:
    - backend:lint
    - backend:typecheck
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_ci
    POSTGRES_PASSWORD: upcp_ci
    POSTGRES_DB: upcp_ci
    DATABASE_URL: "postgresql+psycopg://upcp_ci:upcp_ci@postgres:5432/upcp_ci"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only-secure-key-for-testing-32b
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
    - pip install --quiet -r backend/requirements.txt pytest-xdist
  script:
    - python -m pytest backend/tests -q --tb=short -x -n auto
        --cov=app --cov-report=term-missing --cov-report=xml:backend/coverage.xml
        --cov-fail-under=85
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

backend:migrations:
  stage: test
  extends:
    - .python-base
    - .retry-on-system-failure
  needs:
    - backend:lint
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_mig
    POSTGRES_PASSWORD: upcp_mig_ci
    POSTGRES_DB: upcp_mig
    DATABASE_URL: "postgresql+psycopg://upcp_mig:upcp_mig_ci@postgres:5432/upcp_mig"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only-secure-key-for-testing-32b
  script:
    # Fresh empty DB: the whole migration chain must apply cleanly. Catches
    # broken/non-idempotent migrations in CI instead of crash-looping a
    # deployed container (incident 2026-10-17: 0019/0023).
    - alembic upgrade head
    - alembic current
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:test:
  stage: test
  extends:
    - .frontend-base
    - .retry-on-system-failure
  needs:
    - frontend:lint
  script:
    - npm run test -- --reporter=default --reporter=junit --outputFile=test-results.xml
  after_script:
    - |
      if [ -f test-results.xml ]; then
        echo "=== JUnit Summary ==="
        grep -o 'failures="[0-9]*"' test-results.xml | head -5
        grep -o 'errors="[0-9]*"' test-results.xml | head -5
      fi
  artifacts:
    when: always
    reports:
      junit: frontend/test-results.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

backend:security:
  stage: test
  extends:
    - .retry-on-system-failure
  image: python:3.12-slim
  needs:
    - backend:lint
  cache:
    key: bandit
    paths:
      - .cache/pip
  before_script:
    - pip install --quiet bandit
  script:
    - bandit -r backend/app -c backend/bandit.yaml -f json -o bandit-report.json -q
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

dependency:scan:backend:
  stage: test
  extends:
    - .python-base
    - .retry-on-system-failure
  needs:
    - backend:lint
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit --requirement backend/requirements.txt --desc on || echo "pip-audit failed (network issue), skipping"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

dependency:scan:frontend:
  stage: test
  extends:
    - .frontend-base
    - .retry-on-system-failure
  needs:
    - frontend:lint
  script:
    - npm audit --audit-level=high || echo "npm audit failed (network issue), skipping"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

container:scan:backend:
  stage: test
  extends:
    - .retry-on-system-failure
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - backend:lint
  allow_failure: true
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --format table backend/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# CD: BUILD — stage 3 (only on develop push and main push)
# ══════════════════════════════════════════════════════════════

build:backend:
  extends: .docker-build-base
  script:
    # FLOAT_TAG is the branch floating tag: dev on develop, stage on main.
    # cache-from: branch tag first, :dev always included as cross-branch
    # fallback (BuildKit tolerates a missing cache image — warning only).
    - |
      CACHE_ARGS="--cache-from $REGISTRY/backend:dev"
      if [ "$FLOAT_TAG" != "dev" ]; then
        CACHE_ARGS="--cache-from $REGISTRY/backend:$FLOAT_TAG $CACHE_ARGS"
      fi
      docker build $CACHE_ARGS \
        --tag $REGISTRY/backend:$CI_COMMIT_SHORT_SHA \
        --tag $REGISTRY/backend:$FLOAT_TAG \
        .
    - docker push $REGISTRY/backend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/backend:$FLOAT_TAG
  after_script:
    # Retention: SHA tag is already in registry — drop it locally; keep only
    # the branch floating tag ($FLOAT_TAG) as the cache-from source. Prune
    # stale dangling images so builds don't pile up on the shared runner host;
    # `until=24h` protects concurrent/other builds.
    - |
      for t in $(docker images --format '{{.Tag}}' "$REGISTRY/backend"); do
        [ "$t" = "$FLOAT_TAG" ] || docker rmi "$REGISTRY/backend:$t" || true
      done
      docker image prune -f --filter "until=24h" || true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        FLOAT_TAG: "dev"
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        FLOAT_TAG: "stage"

build:frontend:
  extends: .docker-build-base
  script:
    # Same tag scheme as build:backend — FLOAT_TAG from rules below.
    - |
      CACHE_ARGS="--cache-from $REGISTRY/frontend:dev"
      if [ "$FLOAT_TAG" != "dev" ]; then
        CACHE_ARGS="--cache-from $REGISTRY/frontend:$FLOAT_TAG $CACHE_ARGS"
      fi
      docker build $CACHE_ARGS \
        --tag $REGISTRY/frontend:$CI_COMMIT_SHORT_SHA \
        --tag $REGISTRY/frontend:$FLOAT_TAG \
        frontend/
    - docker push $REGISTRY/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/frontend:$FLOAT_TAG
  after_script:
    # Retention: same as build:backend — keep only the branch floating tag
    # locally, prune stale dangling images older than 24h (safe for
    # concurrent jobs).
    - |
      for t in $(docker images --format '{{.Tag}}' "$REGISTRY/frontend"); do
        [ "$t" = "$FLOAT_TAG" ] || docker rmi "$REGISTRY/frontend:$t" || true
      done
      docker image prune -f --filter "until=24h" || true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        FLOAT_TAG: "dev"
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        FLOAT_TAG: "stage"

# ══════════════════════════════════════════════════════════════
# CD: DEPLOY — stage 4
# ══════════════════════════════════════════════════════════════

deploy:dev:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
    GIT_STRATEGY: clone
  environment:
    name: dev
    url: http://localhost:3080
  resource_group: dev
  needs:
    - build:backend
    - build:frontend
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
    - docker pull $REGISTRY/backend:dev
    - docker pull $REGISTRY/frontend:dev
    # Point compose at exactly the images pulled above — recreates containers
    # with the image the pipeline just built (no local re-tag aliases).
    - export UPCP_BACKEND_IMAGE=$REGISTRY/backend:dev
    - export UPCP_FRONTEND_IMAGE=$REGISTRY/frontend:dev
    - docker compose -f docker-compose.stage.yml build nginx
    - docker compose -f docker-compose.stage.yml up -d --force-recreate --remove-orphans
    - echo "Waiting for app health check..."
    # Must FAIL the job when the app never becomes healthy (crash-looping
    # containers still "complete" a bare retry loop — that masked the
    # broken-migration incident of 2026-10-17).
    - |
      healthy=0
      for i in $(seq 1 30); do
        if wget -qO- http://localhost:38081/health; then healthy=1; break; fi
        sleep 2
      done
      if [ "$healthy" -ne 1 ]; then
        echo "ERROR: backend never became healthy — last logs:"
        docker compose -f docker-compose.stage.yml logs --tail 50 app || true
        exit 1
      fi
    - echo "Dev deployment complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy:stage:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
    GIT_STRATEGY: clone
  environment:
    name: stage
    url: http://localhost:3080
  resource_group: stage
  needs:
    - build:backend
    - build:frontend
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
    - docker pull $REGISTRY/backend:stage
    - docker pull $REGISTRY/frontend:stage
    # Point compose at exactly the images pulled above — the build stage of
    # this main pipeline pushed :stage, so this deploys the just-built image.
    - export UPCP_BACKEND_IMAGE=$REGISTRY/backend:stage
    - export UPCP_FRONTEND_IMAGE=$REGISTRY/frontend:stage
    - docker compose -f docker-compose.stage.yml build nginx
    - docker compose -f docker-compose.stage.yml up -d --force-recreate --remove-orphans
    - echo "Waiting for app health check..."
    # Same as deploy:dev — a health failure must fail the job, not fall
    # through to "complete".
    - |
      healthy=0
      for i in $(seq 1 30); do
        if wget -qO- http://localhost:38081/health; then healthy=1; break; fi
        sleep 2
      done
      if [ "$healthy" -ne 1 ]; then
        echo "ERROR: backend never became healthy — last logs:"
        docker compose -f docker-compose.stage.yml logs --tail 50 app || true
        exit 1
      fi
    - echo "Stage deployment complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

stop:stage:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  environment:
    name: stage
    action: stop
  script:
    - docker compose -f docker-compose.stage.yml down -v
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# CD: MAINTENANCE — manual retention sweep (TASK-0136)
# ══════════════════════════════════════════════════════════════

maintenance:cleanup:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
  resource_group: maintenance
  script:
    # 1. Local SHA tags of upcp images — already pushed to registry by build
    #    jobs; the branch floating tag (dev/stage) is kept as --cache-from
    #    source (this loop only ever matches SHA tags).
    - |
      for repo in backend frontend; do
        for t in $(docker images --format '{{.Tag}}' "$REGISTRY/$repo" | grep -E '^[0-9a-f]{7,40}$' || true); do
          docker rmi "$REGISTRY/$repo:$t" && echo "removed local tag $repo:$t" || true
        done
      done
    # 2. Dangling images older than 30d. `until` filters by creation time;
    #    docker skips images referenced by any container (verified against
    #    moby prune source) — safe on this shared runner host.
    - docker image prune -f --filter "until=720h" || true
    # 3. GitLab runner cache volumes (runner-*-cache-*) older than 30d and
    #    not linked to any container. Worst case a cache miss on next build.
    - |
      CUT=$(date -u -d @$(( $(date +%s) - 2592000 )) +%Y-%m-%dT%H:%M:%S)
      for v in $(docker volume ls -q --filter name='runner-' --filter dangling=true | grep -E 'runner-[0-9a-f]+-cache' || true); do
        created=$(docker volume inspect -f '{{.CreatedAt}}' "$v" | cut -c1-19)
        if [ "$created" \< "$CUT" ]; then
          docker volume rm "$v" && echo "removed old cache volume $v" || true
        fi
      done
    - docker system df
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
