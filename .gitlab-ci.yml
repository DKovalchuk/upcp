# ════════════════════════════════════════════════════════════════
# UPCP CI/CD Pipeline (optimized)
# ════════════════════════════════════════════════════════════════
#
# Flow:
#   feature/* → MR → develop   (lint + unit test)
#   develop   → MR → main      (lint + all tests + build)
#   main      → deploy:stage    (manual confirmation)
#
# Optimizations:
#   - DAG with needs: for maximum parallelism
#   - GIT_DEPTH: 1 for shallow clone
#   - pull_policy: if-not-present for Docker images
#   - pytest-xdist for parallel test execution
#   - Docker BuildKit for faster builds
#   - Cache policy: pull for branches, push for main
#
# ════════════════════════════════════════════════════════════════

stages:
  - lint
  - test
  - build
  - deploy

default:
  tags:
    - laptop
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
    GIT_CLEAN_FLAGS: -ffdx -e .cache/ -e node_modules/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# ── Workflow rules ─────────────────────────────────────────────
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ════════════════════════════════════════════════════════════════
# LINT — fast feedback, runs immediately (no stage dependency)
# ════════════════════════════════════════════════════════════════

.backend-lint-template:
  stage: lint
  image: python:3.12-slim
  needs: []
  cache:
    key:
      files:
        - backend/requirements.txt
      prefix: backend-pip
    paths:
      - .cache/pip
    fallback_keys:
      - backend-pip
    policy: pull
  before_script:
    - pip install --prefer-offline --quiet ruff mypy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

backend:lint:
  extends: .backend-lint-template
  script:
    - ruff check backend
    - ruff format --check backend

backend:typecheck:
  extends: .backend-lint-template
  script:
    - mypy backend/app

frontend:lint:
  stage: lint
  image: node:20-alpine
  needs: []
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - .cache/npm
      - frontend/node_modules
    fallback_keys:
      - frontend-npm
    policy: pull
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ════════════════════════════════════════════════════════════════
# TEST — unit tests + coverage, runs in parallel with lint
# ════════════════════════════════════════════════════════════════

.backend-test-template:
  stage: test
  image: python:3.12-slim
  needs: []
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_ci
    POSTGRES_PASSWORD: upcp_ci
    POSTGRES_DB: upcp_ci
    DATABASE_URL: "postgresql+psycopg://upcp_ci:upcp_ci@postgres:5432/upcp_ci"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only
  cache:
    key:
      files:
        - backend/requirements.txt
      prefix: backend-pip
    paths:
      - .cache/pip
    fallback_keys:
      - backend-pip
    policy: pull
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
    - pip install --prefer-offline --quiet -r backend/requirements.txt pytest-xdist

backend:test:
  extends: .backend-test-template
  script:
    - python -m pytest backend/tests -q --tb=short -x -n auto
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:test:
  stage: test
  image: node:20-alpine
  needs: []
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - .cache/npm
      - frontend/node_modules
    fallback_keys:
      - frontend-npm
    policy: pull
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run test -- --coverage
  artifacts:
    reports:
      junit: frontend/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ════════════════════════════════════════════════════════════════
# TEST — security (develop + main only, allow_failure)
# ════════════════════════════════════════════════════════════════

backend:security:
  stage: test
  image: python:3.12-slim
  needs: []
  before_script:
    - pip install --prefer-offline --quiet bandit pip-audit
  script:
    - bandit -r backend/app -f json -o bandit-report.json -q
    - pip-audit -r backend/requirements.txt
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ════════════════════════════════════════════════════════════════
# BUILD — Docker images with BuildKit
# ════════════════════════════════════════════════════════════════

.build-template:
  stage: build
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: 1
    REGISTRY: "gitlab.local:8929"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$REGISTRY"

build:backend-image:
  extends: .build-template
  needs:
    - backend:test
    - backend:security
  script:
    - docker build --cache-from "$REGISTRY/$CI_PROJECT_PATH/backend:dev" -t "$REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_SHORT_SHA" -t "$REGISTRY/$CI_PROJECT_PATH/backend:dev" .
    - docker push "$REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_SHORT_SHA" || true
    - docker push "$REGISTRY/$CI_PROJECT_PATH/backend:dev" || true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

build:frontend-image:
  extends: .build-template
  needs:
    - frontend:test
  script:
    - docker build --cache-from "$REGISTRY/$CI_PROJECT_PATH/frontend:dev" -t "$REGISTRY/$CI_PROJECT_PATH/frontend:$CI_COMMIT_SHORT_SHA" -t "$REGISTRY/$CI_PROJECT_PATH/frontend:dev" frontend/
    - docker push "$REGISTRY/$CI_PROJECT_PATH/frontend:$CI_COMMIT_SHORT_SHA" || true
    - docker push "$REGISTRY/$CI_PROJECT_PATH/frontend:dev" || true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:build:
  stage: build
  image: node:20-alpine
  needs: []
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - .cache/npm
      - frontend/node_modules
    fallback_keys:
      - frontend-npm
    policy: pull
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ════════════════════════════════════════════════════════════════
# DEPLOY — stage environment (main only, manual)
# ════════════════════════════════════════════════════════════════

deploy:stage:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    REGISTRY: "gitlab.local:8929"
  environment:
    name: stage
    url: http://localhost:3080
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$REGISTRY"
  script:
    - docker pull "$REGISTRY/$CI_PROJECT_PATH/backend:dev"
    - docker tag "$REGISTRY/$CI_PROJECT_PATH/backend:dev" "$REGISTRY/$CI_PROJECT_PATH/backend:stage"
    - docker push "$REGISTRY/$CI_PROJECT_PATH/backend:stage" || true
    - docker pull "$REGISTRY/$CI_PROJECT_PATH/frontend:dev"
    - docker tag "$REGISTRY/$CI_PROJECT_PATH/frontend:dev" "$REGISTRY/$CI_PROJECT_PATH/frontend:stage"
    - docker push "$REGISTRY/$CI_PROJECT_PATH/frontend:stage" || true
    - echo "Stage images ready. Deploy with docker compose -f docker-compose.stage.yml up -d"
  needs:
    - build:backend-image
    - build:frontend-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
