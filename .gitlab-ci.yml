# ══════════════════════════════════════════════════════════════
# UPCP CI/CD Pipeline
# ══════════════════════════════════════════════════════════════
#
# CI (continuous integration):
#   feature/* → MR → develop   (lint → test)
#   develop   → MR → main      (lint → test)
#
# CD (continuous delivery):
#   develop   → build → deploy:dev    (automatic)
#   main      → build → deploy:stage  (manual)
#   (manual)  maintenance:cleanup     → retention sweep on runner host
#
# Stage ordering: lint → test → build → deploy
# Pipeline stops at first failed stage.

stages:
  - lint
  - test
  - quality
  - build
  - deploy

# ── Workflow rules ────────────────────────────────────────────
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    # nightly quality-gate runs (pipeline schedule on develop, TASK-0143)
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  tags:
    - laptop
  interruptible: true
  timeout: 30 minutes

# ── Global variables ──────────────────────────────────────────
variables:
  GIT_DEPTH: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  DOCKER_BUILDKIT: "1"

# ── Retry policy ──────────────────────────────────────────────
.retry-on-system-failure:
  retry:
    max: 1
    when:
      - runner_system_failure

# ══════════════════════════════════════════════════════════════
# TEMPLATES
# ══════════════════════════════════════════════════════════════

.python-base:
  image: python:3.12-slim
  cache:
    key:
      files:
        - backend/requirements.txt
      prefix: backend-pip
    paths:
      - .cache/pip
    fallback_keys:
      - backend-pip
  before_script:
    - pip install --quiet -r backend/requirements.txt

.frontend-base:
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - .cache/npm
    fallback_keys:
      - frontend-npm
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund

.docker-build-base:
  stage: build
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY

# ══════════════════════════════════════════════════════════════
# CI: LINT — stage 1
# ══════════════════════════════════════════════════════════════

backend:lint:
  stage: lint
  extends:
    - .python-base
    - .retry-on-system-failure
  script:
    - ruff check backend
    - ruff format --check backend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

backend:typecheck:
  stage: lint
  extends:
    - .python-base
    - .retry-on-system-failure
  script:
    - mypy backend/app
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:lint:
  stage: lint
  extends:
    - .frontend-base
    - .retry-on-system-failure
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# CI: TEST — stage 2
# ══════════════════════════════════════════════════════════════

backend:test:
  stage: test
  extends:
    - .python-base
    - .retry-on-system-failure
  needs:
    - backend:lint
    - backend:typecheck
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_ci
    POSTGRES_PASSWORD: upcp_ci
    POSTGRES_DB: upcp_ci
    DATABASE_URL: "postgresql+psycopg://upcp_ci:upcp_ci@postgres:5432/upcp_ci"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only-secure-key-for-testing-32b
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
    - pip install --quiet -r backend/requirements.txt pytest-xdist
  script:
    - python -m pytest backend/tests -q --tb=short -x -n auto
        --cov=app --cov-report=term-missing --cov-report=xml:backend/coverage.xml
        --cov-fail-under=85
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

backend:migrations:
  stage: test
  extends:
    - .python-base
    - .retry-on-system-failure
  needs:
    - backend:lint
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_mig
    POSTGRES_PASSWORD: upcp_mig_ci
    POSTGRES_DB: upcp_mig
    DATABASE_URL: "postgresql+psycopg://upcp_mig:upcp_mig_ci@postgres:5432/upcp_mig"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only-secure-key-for-testing-32b
  script:
    # Fresh empty DB: the whole migration chain must apply cleanly. Catches
    # broken/non-idempotent migrations in CI instead of crash-looping a
    # deployed container (incident 2026-10-17: 0019/0023).
    - alembic upgrade head
    - alembic current
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:test:
  stage: test
  extends:
    - .frontend-base
    - .retry-on-system-failure
  needs:
    - frontend:lint
  script:
    - npm run test -- --reporter=default --reporter=junit --outputFile=test-results.xml
  after_script:
    - |
      if [ -f test-results.xml ]; then
        echo "=== JUnit Summary ==="
        grep -o 'failures="[0-9]*"' test-results.xml | head -5
        grep -o 'errors="[0-9]*"' test-results.xml | head -5
      fi
  artifacts:
    when: always
    reports:
      junit: frontend/test-results.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

backend:security:
  stage: test
  extends:
    - .retry-on-system-failure
  image: python:3.12-slim
  needs:
    - backend:lint
  cache:
    key: bandit
    paths:
      - .cache/pip
  before_script:
    - pip install --quiet bandit
  script:
    - bandit -r backend/app -c backend/bandit.yaml -f json -o bandit-report.json -q
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

dependency:scan:backend:
  stage: test
  extends:
    - .python-base
    - .retry-on-system-failure
  needs:
    - backend:lint
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit --requirement backend/requirements.txt --desc on || echo "pip-audit failed (network issue), skipping"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

dependency:scan:frontend:
  stage: test
  extends:
    - .frontend-base
    - .retry-on-system-failure
  needs:
    - frontend:lint
  script:
    - npm audit --audit-level=high || echo "npm audit failed (network issue), skipping"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

container:scan:backend:
  stage: test
  extends:
    - .retry-on-system-failure
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - backend:lint
  allow_failure: true
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --format table backend/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# CI: QUALITY GATE — stage 3 (SPEC-0024 Phase 5, TASK-0143)
# ══════════════════════════════════════════════════════════════
#
# Ephemeral hermetic test stack (upcp-test-ci via .env.ci); suites run
# INSIDE its network — job containers cannot reach host loopback (the
# deploy-probe incident). Two-phase policy: allow_failure: true until
# >=2 green develop + >=1 green schedule runs are observed, then flipped
# to a hard gate in a follow-up commit. Nightly `perf load` never gates
# (honest red SLO — TASK-0140 findings).

quality:gate:
  stage: quality
  image: python:3.12-slim
  extends:
    - .retry-on-system-failure
  timeout: 1 hour 30 minutes
  resource_group: quality-gate
  allow_failure: true
  needs:
    - job: backend:test
    - job: backend:migrations
  variables:
    # COMPOSE_FILE pins every compose invocation (incl. nested ones inside
    # suite wrappers) to the test stack — without it compose would pick
    # docker-compose.yml (the dev stack) from the repo root
    COMPOSE_FILE: docker-compose.test.yml
    COMPOSE_PROJECT_NAME: upcp-test-ci
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    QUALITY_PROFILE: "quick"
    E2E_BASE_URL: "http://nginx"
    CHAOS_BASE_URL: "http://app:8080"
    CHAOS_COMPOSE_PROJECT: "upcp-test-ci"
    SECURITY_BASE_URL: "http://app:8080"
    # authz RBAC fixtures discover the second user via a direct DB lookup —
    # must point at the gate stack's postgres (from .env.ci), not the local
    # test stack's 35434 (wrong-DB member ids failed 3 checks in rehearsal)
    SECURITY_DB_PORT: "35436"
    LOCUST_HOST: "http://app:8080"
  rules:
    # nightly schedule → full profiles (chaos full, security full, perf load)
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        QUALITY_PROFILE: "full"
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    # docker CLI + compose plugin: job image is python-slim, the runner only
    # injects the daemon socket (same approach as .docker-build-base)
    - apt-get update -qq
    - apt-get install -y -qq ca-certificates curl gnupg >/dev/null
    - install -m0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
    - chmod a+r /etc/apt/keyrings/docker.asc
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update -qq && apt-get install -y -qq docker-ce-cli docker-compose-plugin >/dev/null
    - pip install --quiet -r tests/security/requirements.txt -r tests/chaos/requirements.txt -r tests/performance/requirements.txt locust
    - docker compose version
  script:
    # ── 1. reporter unit tests (TDD'd in-repo) + compose config sanity ──
    - python -m pytest tests/quality_gate -o addopts= -o pythonpath= -q
    - docker compose --env-file .env.ci config --quiet
    # ── 2. ephemeral stack from THIS commit (images rebuilt; layer cache on the shared daemon) ──
    - docker compose --env-file .env.ci build app frontend nginx
    - docker compose --env-file .env.ci up -d db redis app frontend nginx
    - |
      healthy=0
      for i in $(seq 1 40); do
        if docker compose --env-file .env.ci exec -T app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)" 2>/dev/null; then
          healthy=1; break
        fi
        sleep 3
      done
      if [ "$healthy" -ne 1 ]; then
        echo "ERROR: gate stack never became healthy — logs:"
        docker compose --env-file .env.ci logs --tail 100 app db || true
        exit 1
      fi
    # ── 3. job joins the gate network — suites resolve http://app:8080 / http://nginx
    #       (job container sits on gitlab-local_default; host loopback is unreachable) ──
    - docker network connect upcp-test-ci_default "$(cat /etc/hostname)"
    - python -c "import httpx,sys; sys.exit(0 if httpx.get('http://app:8080/health',timeout=5).status_code==200 else 1)"
    - docker compose --env-file .env.ci --profile tools run --rm seeder
    # ── 4. suites — profiles chosen by QUALITY_PROFILE; RCs collected, report always runs ──
    - chown 1000:1000 . frontend || true
    - RC_E2E=0 RC_E2E_FE=0 RC_CHAOS=0 RC_SEC=0 RC_PERF=0
    - |
      if [ "$QUALITY_PROFILE" = "full" ]; then
        CHAOS_P=full; SEC_P=full; PERF_P=load
      else
        CHAOS_P=quick; SEC_P=baseline; PERF_P=smoke
      fi
    # Root suite: 3 specs call the API directly (nginx.test.conf does not
    # proxy /openapi.json, /metrics) → E2E_API_BASE; SPA login goes same-origin
    # via the new /auth location in nginx.test.conf.
    # Frontend suite: vite proxy target VITE_API_URL; its own vite origin.
    - docker compose --env-file .env.ci --profile ci run --rm -e E2E_API_BASE=http://app:8080 -e E2E_ADMIN_PASSWORD=TestAdmin123! e2e sh -c "npm ci --no-audit --no-fund && npx playwright test" || RC_E2E=$?
    - docker compose --env-file .env.ci --profile ci run --rm -e PLAYWRIGHT_BASE_URL=http://localhost:5173 -e VITE_API_URL=http://app:8080 -e E2E_ADMIN_PASSWORD=TestAdmin123! e2e sh -c "cd frontend && npm ci --no-audit --no-fund && npx playwright test" || RC_E2E_FE=$?
    - python tests/chaos/runner.py --profile "$CHAOS_P" --report || RC_CHAOS=$?
    - python tests/security/runner.py --profile "$SEC_P" --report || RC_SEC=$?
    - python tests/performance/runner.py --profile "$PERF_P" --report || RC_PERF=$?
    # ── 5. aggregate report (artifact) + gate verdict ──
    - python tests/quality_gate/aggregate.py --results-root tests --out-dir . --profile "$QUALITY_PROFILE"
    - |
      echo "RCs: e2e=$RC_E2E e2e_fe=$RC_E2E_FE chaos=$RC_CHAOS security=$RC_SEC perf=$RC_PERF"
      GATE=$RC_E2E
      for rc in $RC_E2E_FE $RC_CHAOS $RC_SEC; do [ "$rc" -gt "$GATE" ] && GATE=$rc; done
      # perf gates only on quick (smoke must pass); the nightly load profile is
      # the known-honest-red SLO run (TASK-0140) → report-only, never gates
      if [ "$QUALITY_PROFILE" = "quick" ] && [ "$RC_PERF" -gt "$GATE" ]; then GATE=$RC_PERF; fi
      echo "quality gate exit: $GATE"
      exit $GATE
  after_script:
    - docker compose --env-file .env.ci --profile tools --profile ci --profile security down -v --remove-orphans || true
  artifacts:
    when: always
    paths:
      - quality-report.md
      - quality-report.json
      - tests/chaos/results/
      - tests/security/results/
      - tests/performance/results/
      - tests/chaos/reports/*.md
      - tests/security/reports/*.md
      - tests/performance/reports/*.md
    expire_in: 30 days

# ══════════════════════════════════════════════════════════════
# CD: BUILD — stage 4 (only on develop push and main push)
# ══════════════════════════════════════════════════════════════

build:backend:
  extends: .docker-build-base
  script:
    # FLOAT_TAG is the branch floating tag: dev on develop, stage on main.
    # cache-from: branch tag first, :dev always included as cross-branch
    # fallback (BuildKit tolerates a missing cache image — warning only).
    - |
      CACHE_ARGS="--cache-from $REGISTRY/backend:dev"
      if [ "$FLOAT_TAG" != "dev" ]; then
        CACHE_ARGS="--cache-from $REGISTRY/backend:$FLOAT_TAG $CACHE_ARGS"
      fi
      docker build $CACHE_ARGS \
        --tag $REGISTRY/backend:$CI_COMMIT_SHORT_SHA \
        --tag $REGISTRY/backend:$FLOAT_TAG \
        .
    - docker push $REGISTRY/backend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/backend:$FLOAT_TAG
  after_script:
    # Retention: SHA tag is already in registry — drop it locally; keep only
    # the branch floating tag ($FLOAT_TAG) as the cache-from source. Prune
    # stale dangling images so builds don't pile up on the shared runner host;
    # `until=24h` protects concurrent/other builds.
    - |
      for t in $(docker images --format '{{.Tag}}' "$REGISTRY/backend"); do
        [ "$t" = "$FLOAT_TAG" ] || docker rmi "$REGISTRY/backend:$t" || true
      done
      docker image prune -f --filter "until=24h" || true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        FLOAT_TAG: "dev"
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        FLOAT_TAG: "stage"

build:frontend:
  extends: .docker-build-base
  script:
    # Same tag scheme as build:backend — FLOAT_TAG from rules below.
    - |
      CACHE_ARGS="--cache-from $REGISTRY/frontend:dev"
      if [ "$FLOAT_TAG" != "dev" ]; then
        CACHE_ARGS="--cache-from $REGISTRY/frontend:$FLOAT_TAG $CACHE_ARGS"
      fi
      docker build $CACHE_ARGS \
        --tag $REGISTRY/frontend:$CI_COMMIT_SHORT_SHA \
        --tag $REGISTRY/frontend:$FLOAT_TAG \
        frontend/
    - docker push $REGISTRY/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/frontend:$FLOAT_TAG
  after_script:
    # Retention: same as build:backend — keep only the branch floating tag
    # locally, prune stale dangling images older than 24h (safe for
    # concurrent jobs).
    - |
      for t in $(docker images --format '{{.Tag}}' "$REGISTRY/frontend"); do
        [ "$t" = "$FLOAT_TAG" ] || docker rmi "$REGISTRY/frontend:$t" || true
      done
      docker image prune -f --filter "until=24h" || true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        FLOAT_TAG: "dev"
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        FLOAT_TAG: "stage"

# ══════════════════════════════════════════════════════════════
# CD: DEPLOY — stage 4
# ══════════════════════════════════════════════════════════════

deploy:dev:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
    GIT_STRATEGY: clone
    # Dev environment owns its compose project/ports/data — it used to share
    # the upcp-stage project with deploy:stage (whoever ran last won).
    # Split + honest URL per TASK-0143 (stage stays 3070/38081/35433/36382).
    COMPOSE_PROJECT_NAME: upcp-dev
    UPCP_PORT_FRONTEND: "3073"
    UPCP_PORT_BACKEND: "38083"
    UPCP_PORT_POSTGRES: "35435"
    UPCP_PORT_REDIS: "36384"
    UPCP_DATA_POSTGRES: ./data/postgres-dev
    UPCP_DATA_REDIS: ./data/redis-dev
  environment:
    name: dev
    url: http://localhost:3073
  resource_group: dev
  needs:
    - build:backend
    - build:frontend
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
    - docker pull $REGISTRY/backend:dev
    - docker pull $REGISTRY/frontend:dev
    # Point compose at exactly the images pulled above — recreates containers
    # with the image the pipeline just built (no local re-tag aliases).
    - export UPCP_BACKEND_IMAGE=$REGISTRY/backend:dev
    - export UPCP_FRONTEND_IMAGE=$REGISTRY/frontend:dev
    - docker compose -f docker-compose.stage.yml build nginx
    - docker compose -f docker-compose.stage.yml up -d --force-recreate --remove-orphans
    - echo "Waiting for app health check..."
    # Probe INSIDE the app container: the job runs on the gitlab-local
    # docker network (runner network_mode), so the host's 127.0.0.1:38081
    # is unreachable from here — a host wget never could succeed (the old
    # loop silently fell through, masking the 2026-10-17 incident).
    - |
      healthy=0
      for i in $(seq 1 40); do
        if docker compose -f docker-compose.stage.yml exec -T app \
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"; then
          healthy=1; break
        fi
        sleep 3
      done
      if [ "$healthy" -ne 1 ]; then
        echo "ERROR: backend never became healthy — last logs:"
        docker compose -f docker-compose.stage.yml logs --tail 50 app || true
        exit 1
      fi
    - echo "Dev deployment complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy:stage:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
    GIT_STRATEGY: clone
  environment:
    name: stage
    url: http://localhost:3070
  resource_group: stage
  needs:
    - build:backend
    - build:frontend
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
    - docker pull $REGISTRY/backend:stage
    - docker pull $REGISTRY/frontend:stage
    # Point compose at exactly the images pulled above — the build stage of
    # this main pipeline pushed :stage, so this deploys the just-built image.
    - export UPCP_BACKEND_IMAGE=$REGISTRY/backend:stage
    - export UPCP_FRONTEND_IMAGE=$REGISTRY/frontend:stage
    - docker compose -f docker-compose.stage.yml build nginx
    - docker compose -f docker-compose.stage.yml up -d --force-recreate --remove-orphans
    - echo "Waiting for app health check..."
    # Same as deploy:dev — probe inside the app container (host loopback is
    # unreachable from the job's docker network); health failure fails the job.
    - |
      healthy=0
      for i in $(seq 1 40); do
        if docker compose -f docker-compose.stage.yml exec -T app \
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"; then
          healthy=1; break
        fi
        sleep 3
      done
      if [ "$healthy" -ne 1 ]; then
        echo "ERROR: backend never became healthy — last logs:"
        docker compose -f docker-compose.stage.yml logs --tail 50 app || true
        exit 1
      fi
    - echo "Stage deployment complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

stop:stage:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  environment:
    name: stage
    action: stop
  script:
    - docker compose -f docker-compose.stage.yml down -v
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# CD: MAINTENANCE — manual retention sweep (TASK-0136)
# ══════════════════════════════════════════════════════════════

maintenance:cleanup:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
  resource_group: maintenance
  script:
    # 1. Local SHA tags of upcp images — already pushed to registry by build
    #    jobs; the branch floating tag (dev/stage) is kept as --cache-from
    #    source (this loop only ever matches SHA tags).
    - |
      for repo in backend frontend; do
        for t in $(docker images --format '{{.Tag}}' "$REGISTRY/$repo" | grep -E '^[0-9a-f]{7,40}$' || true); do
          docker rmi "$REGISTRY/$repo:$t" && echo "removed local tag $repo:$t" || true
        done
      done
    # 2. Dangling images older than 30d. `until` filters by creation time;
    #    docker skips images referenced by any container (verified against
    #    moby prune source) — safe on this shared runner host.
    - docker image prune -f --filter "until=720h" || true
    # 3. GitLab runner cache volumes (runner-*-cache-*) older than 30d and
    #    not linked to any container. Worst case a cache miss on next build.
    - |
      CUT=$(date -u -d @$(( $(date +%s) - 2592000 )) +%Y-%m-%dT%H:%M:%S)
      for v in $(docker volume ls -q --filter name='runner-' --filter dangling=true | grep -E 'runner-[0-9a-f]+-cache' || true); do
        created=$(docker volume inspect -f '{{.CreatedAt}}' "$v" | cut -c1-19)
        if [ "$created" \< "$CUT" ]; then
          docker volume rm "$v" && echo "removed old cache volume $v" || true
        fi
      done
    - docker system df
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
