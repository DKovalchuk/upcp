stages:
  - lint
  - test
  - build
  - deploy

default:
  tags:
    - laptop

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# ══════════════════════════════════════════════
# DEV — lint + unit tests (every push to develop)
# ══════════════════════════════════════════════

backend:lint:
  stage: lint
  image: python:3.12-slim
  cache:
    key: backend-pip
    paths:
      - .cache/pip
  before_script:
    - pip install --quiet ruff mypy
  script:
    - ruff check backend
    - ruff format --check backend
    - mypy backend/app
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

backend:unit-test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_ci
    POSTGRES_PASSWORD: upcp_ci
    POSTGRES_DB: upcp_ci
    DATABASE_URL: "postgresql+psycopg://upcp_ci:upcp_ci@postgres:5432/upcp_ci"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only
  cache:
    key: backend-pip
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - pytest tests -q --tb=short -x
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

backend:coverage:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_ci
    POSTGRES_PASSWORD: upcp_ci
    POSTGRES_DB: upcp_ci
    DATABASE_URL: "postgresql+psycopg://upcp_ci:upcp_ci@postgres:5432/upcp_ci"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only
  cache:
    key: backend-pip
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - pytest tests --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80 -q
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

frontend:lint:
  stage: lint
  image: node:20-alpine
  cache:
    key: frontend-npm
    paths:
      - .cache/npm
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

frontend:test:
  stage: test
  image: node:20-alpine
  cache:
    key: frontend-npm
    paths:
      - .cache/npm
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm run test
  artifacts:
    reports:
      junit: frontend/test-results.xml
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

frontend:build:
  stage: build
  image: node:20-alpine
  cache:
    key: frontend-npm
    paths:
      - .cache/npm
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# ══════════════════════════════════════════════
# TEST — integration, e2e, UI, perf, security
# ══════════════════════════════════════════════

backend:integration-test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_ci
    POSTGRES_PASSWORD: upcp_ci
    POSTGRES_DB: upcp_ci
    DATABASE_URL: "postgresql+psycopg://upcp_ci:upcp_ci@postgres:5432/upcp_ci"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only
  cache:
    key: backend-pip
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - pytest tests/integration -q --tb=short -m integration 2>/dev/null || echo "No integration tests yet"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true

backend:e2e-test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_ci
    POSTGRES_PASSWORD: upcp_ci
    POSTGRES_DB: upcp_ci
    DATABASE_URL: "postgresql+psycopg://upcp_ci:upcp_ci@postgres:5432/upcp_ci"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only
  cache:
    key: backend-pip
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - pytest tests/e2e -q --tb=short -m e2e 2>/dev/null || echo "No e2e tests yet"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true

backend:security-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet bandit safety
  script:
    - bandit -r backend/app -f json -o bandit-report.json 2>/dev/null || echo "Bandit not configured yet"
    - safety check -r backend/requirements.txt 2>/dev/null || echo "Safety not configured yet"
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true

# ══════════════════════════════════════════════
# BUILD — Docker images (dev + stage)
# ══════════════════════════════════════════════

build:backend-image:
  stage: build
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    REGISTRY: "gitlab.local:8929"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$REGISTRY" || echo "Registry login skipped"
  script:
    - docker build -t "$REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_SHORT_SHA" -t "$REGISTRY/$CI_PROJECT_PATH/backend:dev" .
    - docker push "$REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_SHORT_SHA" || echo "Push skipped"
    - docker push "$REGISTRY/$CI_PROJECT_PATH/backend:dev" || echo "Push skipped"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

build:frontend-image:
  stage: build
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    REGISTRY: "gitlab.local:8929"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$REGISTRY" || echo "Registry login skipped"
  script:
    - docker build -t "$REGISTRY/$CI_PROJECT_PATH/frontend:$CI_COMMIT_SHORT_SHA" -t "$REGISTRY/$CI_PROJECT_PATH/frontend:dev" frontend/
    - docker push "$REGISTRY/$CI_PROJECT_PATH/frontend:$CI_COMMIT_SHORT_SHA" || echo "Push skipped"
    - docker push "$REGISTRY/$CI_PROJECT_PATH/frontend:dev" || echo "Push skipped"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# ══════════════════════════════════════════════
# DEPLOY — stage environment (manual)
# ══════════════════════════════════════════════

deploy:stage:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    REGISTRY: "gitlab.local:8929"
  environment:
    name: stage
    url: http://localhost:38080
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$REGISTRY" || echo "Registry login skipped"
  script:
    - docker pull "$REGISTRY/$CI_PROJECT_PATH/backend:dev" || echo "Pull skipped - build locally"
    - docker tag "$REGISTRY/$CI_PROJECT_PATH/backend:dev" "$REGISTRY/$CI_PROJECT_PATH/backend:stage" || echo "Tag skipped"
    - docker push "$REGISTRY/$CI_PROJECT_PATH/backend:stage" || echo "Push skipped"
    - docker pull "$REGISTRY/$CI_PROJECT_PATH/frontend:dev" || echo "Pull skipped - build locally"
    - docker tag "$REGISTRY/$CI_PROJECT_PATH/frontend:dev" "$REGISTRY/$CI_PROJECT_PATH/frontend:stage" || echo "Tag skipped"
    - docker push "$REGISTRY/$CI_PROJECT_PATH/frontend:stage" || echo "Push skipped"
    - echo "Stage images ready. Deploy with docker compose.stage.yml"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
