# ══════════════════════════════════════════════════════════════
# UPCP CI/CD Pipeline
# ══════════════════════════════════════════════════════════════
#
# Flow:
#   feature/* → MR → develop   (lint → test → build)
#   develop   → MR → main      (lint → test → build)
#   main      → deploy:stage   (manual confirmation)
#
# Stage ordering: lint → test → build → deploy
# Pipeline stops at first failed stage — no downstream jobs run.

stages:
  - lint
  - test
  - build
  - deploy

# ── Workflow rules (prevent duplicate pipelines) ───────────────
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  tags:
    - laptop
  interruptible: true
  timeout: 30 minutes

# ── Global variables ──────────────────────────────────────────
variables:
  GIT_DEPTH: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  DOCKER_BUILDKIT: "1"

# ── Retry policy ──────────────────────────────────────────────
.retry-on-system-failure:
  retry:
    max: 1
    when:
      - runner_system_failure

# ══════════════════════════════════════════════════════════════
# TEMPLATES
# ══════════════════════════════════════════════════════════════

.python-base:
  image: python:3.12-slim
  cache:
    key:
      files:
        - backend/requirements.txt
      prefix: backend-pip
    paths:
      - .cache/pip
    fallback_keys:
      - backend-pip
  before_script:
    - pip install --quiet -r backend/requirements.txt

.frontend-base:
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - .cache/npm
    fallback_keys:
      - frontend-npm
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund

.docker-build-base:
  stage: build
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY

# ══════════════════════════════════════════════════════════════
# LINT — stage 1: parallel within stage, pipeline stops if any fails
# ══════════════════════════════════════════════════════════════

backend:lint:
  stage: lint
  extends:
    - .python-base
    - .retry-on-system-failure
  script:
    - ruff check backend
    - ruff format --check backend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

backend:typecheck:
  stage: lint
  extends:
    - .python-base
    - .retry-on-system-failure
  script:
    - mypy backend/app
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:lint:
  stage: lint
  extends:
    - .frontend-base
    - .retry-on-system-failure
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# TEST — stage 2: runs only after ALL lint jobs pass
# ══════════════════════════════════════════════════════════════

backend:test:
  stage: test
  extends:
    - .python-base
    - .retry-on-system-failure
  needs:
    - backend:lint
    - backend:typecheck
  services:
    - postgres:16
  variables:
    POSTGRES_USER: upcp_ci
    POSTGRES_PASSWORD: upcp_ci
    POSTGRES_DB: upcp_ci
    DATABASE_URL: "postgresql+psycopg://upcp_ci:upcp_ci@postgres:5432/upcp_ci"
    UPCP_ENV: ci
    UPCP_SECRET_KEY: ci-test-only
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
    - pip install --quiet -r backend/requirements.txt pytest-xdist
  script:
    - python -m pytest backend/tests -q --tb=short -x -n auto
        --cov=app --cov-report=term-missing --cov-report=xml:backend/coverage.xml
        --cov-fail-under=85
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:test:
  stage: test
  extends:
    - .frontend-base
    - .retry-on-system-failure
  needs:
    - frontend:lint
  script:
    - npm run test -- --reporter=default --reporter=junit --outputFile=test-results.xml
  after_script:
    - |
      if [ -f test-results.xml ]; then
        echo "=== JUnit Summary ==="
        grep -o 'failures="[0-9]*"' test-results.xml | head -5
        grep -o 'errors="[0-9]*"' test-results.xml | head -5
      fi
  artifacts:
    when: always
    reports:
      junit: frontend/test-results.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

backend:security:
  stage: test
  extends:
    - .retry-on-system-failure
  image: python:3.12-slim
  needs:
    - backend:lint
  cache:
    key: bandit
    paths:
      - .cache/pip
  before_script:
    - pip install --quiet bandit
  script:
    - bandit -r backend/app -c backend/bandit.yaml -f json -o bandit-report.json -q
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

dependency:scan:backend:
  stage: test
  extends:
    - .python-base
    - .retry-on-system-failure
  needs:
    - backend:lint
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit --requirement backend/requirements.txt --desc on
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

dependency:scan:frontend:
  stage: test
  extends:
    - .frontend-base
    - .retry-on-system-failure
  needs:
    - frontend:lint
  script:
    - npm audit --audit-level=high || echo "npm audit failed (network issue), skipping"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: ["frontend/**/*"]
    - if: $CI_COMMIT_BRANCH == "main"

container:scan:backend:
  stage: test
  extends:
    - .retry-on-system-failure
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - backend:lint
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --format table backend/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# BUILD — stage 3: runs only after ALL tests pass
# ══════════════════════════════════════════════════════════════

build:backend:
  extends: .docker-build-base
  script:
    - docker build
        --cache-from $REGISTRY/backend:dev
        --tag $REGISTRY/backend:$CI_COMMIT_SHORT_SHA
        --tag $REGISTRY/backend:dev
        .
    - docker push $REGISTRY/backend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/backend:dev
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

build:frontend:
  extends: .docker-build-base
  script:
    - docker build
        --cache-from $REGISTRY/frontend:dev
        --tag $REGISTRY/frontend:$CI_COMMIT_SHORT_SHA
        --tag $REGISTRY/frontend:dev
        frontend/
    - docker push $REGISTRY/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/frontend:dev
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════════════════
# DEPLOY — stage 4: main only, manual
# ══════════════════════════════════════════════════════════════

deploy:stage:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    REGISTRY: registry.gitlab.local:5050/dmitry.kovalchuk/upcp
    GIT_STRATEGY: clone
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - ls -la nginx.stage.conf || (echo "nginx.stage.conf missing after checkout!" && exit 1)
  environment:
    name: stage
    url: http://localhost:3080
  resource_group: stage
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
    - docker pull $REGISTRY/backend:dev
    - docker pull $REGISTRY/frontend:dev
    - docker tag $REGISTRY/backend:dev upcp-backend:stage
    - docker tag $REGISTRY/frontend:dev upcp-frontend:stage
    - docker compose -f docker-compose.stage.yml build nginx
    - docker compose -f docker-compose.stage.yml up -d --force-recreate --remove-orphans
    - echo "Waiting for app health check..."
    - for i in $(seq 1 30); do
        wget -qO- http://localhost:38081/health && break || sleep 2;
      done
    - echo "Stage deployment complete."
  needs:
    - build:backend
    - build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

stop:stage:
  stage: deploy
  image: docker:24
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  environment:
    name: stage
    action: stop
  script:
    - docker compose -f docker-compose.stage.yml down -v
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
