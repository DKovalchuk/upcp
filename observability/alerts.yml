groups:
  - name: upcp-alerts
    rules:
      # ── Availability ──
      - alert: AppDown
        expr: up{job="upcp-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "UPCP app is down"
          description: "The backend has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate (>5%)"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: VeryHighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate (>20%)"
          description: "More than 20% of requests are returning 5xx errors."

      # ── Latency ──
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency >2s"
          description: "95th percentile response time is above 2 seconds."

      # ── Database ──
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "Database health check is failing."

      - alert: HighDBConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High DB connection count"
          description: "More than 80 active database connections."

      # ── Redis ──
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis health check is failing."

      # ── Resources ──
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes / 1024 / 1024 > 512
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage (>512MB)"
          description: "Backend process memory usage is above 512MB."
