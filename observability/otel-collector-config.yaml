# OpenTelemetry Collector configuration — UPCP Test Environment

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: upcp
    const_labels:
      environment: test

  otlphttp/loki:
    # TASK-0151 (grafana/loki:3.4.2, verified empirically):
    # - the native OTLP receiver is served on the MAIN HTTP port under
    #   /otlp (POST /otlp/v1/logs parses and ingests) — there is no
    #   separate 4317/4318 listener (ports closed on the running
    #   container), and a top-level `otlp:` key in loki-config.yaml
    #   fails -verify-config ("field otlp not found in type
    #   loki.ConfigWrapper");
    # - the previous gRPC export to loki:4317 retried forever with
    #   connection-refused (TASK-0140 finding).
    # otlphttp appends /v1/logs to this base endpoint.
    endpoint: http://loki:3100/otlp

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  attributes:
    actions:
      - key: service.name
        value: upcp
        action: upsert
      - key: deployment.environment
        value: test
        action: upsert

  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlphttp/loki]
