# OpenTelemetry Collector configuration — UPCP Test Environment

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: upcp
    const_labels:
      environment: test

  otlp/loki:
    # gRPC exporter (otlp/* default): bare host:port only — paths/schemes
    # make the parser read "3100/otlp" as a port and refuse to start.
    # Loki 3.x exposes the OTLP gRPC receiver on 4317 by default.
    endpoint: loki:4317
    tls:
      insecure: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  attributes:
    actions:
      - key: service.name
        value: upcp
        action: upsert
      - key: deployment.environment
        value: test
        action: upsert

  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlp/loki]
