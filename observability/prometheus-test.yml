# Prometheus configuration — UPCP Test Environment
# Scrapes app /metrics endpoint + OTel Collector + Redis/Postgres exporters

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: upcp-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8080
        labels:
          environment: test

  - job_name: upcp-otel
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
