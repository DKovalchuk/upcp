# Stage (pre-prod) environment
# App/frontend images come from the container registry:
# CI deploy jobs export UPCP_BACKEND_IMAGE / UPCP_FRONTEND_IMAGE to the image
# the pipeline just built (:dev on develop deploys, :stage on main deploys);
# outside CI the defaults below (registry :5050, :stage tag) are used.

name: upcp-stage

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upcp_local_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-upcp}
    ports:
      - "127.0.0.1:${UPCP_PORT_POSTGRES:-35433}:5432"
    volumes:
      # env-driven: deploy:dev runs this file under its own project
      # (upcp-dev) with separate data dirs (TASK-0143)
      - ${UPCP_DATA_POSTGRES:-./data/postgres-stage}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upcp -d upcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPCP_PORT_REDIS:-36382}:6379"
    volumes:
      - ${UPCP_DATA_REDIS:-./data/redis-stage}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  app:
    image: ${UPCP_BACKEND_IMAGE:-registry.gitlab.local:5050/dmitry.kovalchuk/upcp/backend:stage}
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-upcp}:${POSTGRES_PASSWORD:-upcp_local_change_me}@db:5432/${POSTGRES_DB:-upcp}
      REDIS_URL: redis://redis:6379/0
      UPCP_ENV: stage
      UPCP_LOG_LEVEL: INFO
      # Secret is environment-only (untracked .env.stage locally, masked CI
      # variable for deploy:stage) — never hardcoded (TASK-0167).
      UPCP_SECRET_KEY: ${UPCP_SECRET_KEY:?UPCP_SECRET_KEY is required - copy .env.stage.example to .env.stage and run openssl rand -base64 48}
      UPCP_DEBUG: "false"
    ports:
      - "127.0.0.1:${UPCP_PORT_BACKEND:-38081}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: ${UPCP_FRONTEND_IMAGE:-registry.gitlab.local:5050/dmitry.kovalchuk/upcp/frontend:stage}
    restart: unless-stopped
    expose:
      - "35173"
    depends_on:
      - app

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPCP_PORT_FRONTEND:-3070}:80"
    depends_on:
      - app
      - frontend
