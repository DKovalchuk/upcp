name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, typecheck, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: upcp_ci
          POSTGRES_PASSWORD: upcp_ci
          POSTGRES_DB: upcp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upcp_ci -d upcp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://upcp_ci:upcp_ci@localhost:5432/upcp_ci
      UPCP_ENV: ci
      UPCP_SECRET_KEY: ci-test-only-secure-key-for-testing-32b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Ruff lint + format check
        run: ruff check backend && ruff format --check backend
      - name: Mypy
        run: mypy backend/app
      - name: Pytest
        run: python -m pytest backend/tests -q --tb=short -n auto

  frontend:
    name: Frontend — lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint (oxlint)
        run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
      - name: Tests (vitest)
        run: npm run test
