[project]
name = "upcp"
version = "0.20.0"
description = "Universal Project Control Plane"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".venv",
  "node_modules",
  ".git",
  "__pycache__"
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM"
]
ignore = [
  "E501",
  "B008"
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = [
  "untyped-decorator",
  "no-any-return",
  "misc"
]
exclude = [
  ".venv",
  "node_modules"
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0.8"
